# =============================================================================
# Fernanda: Release
# =============================================================================
#
# Triggered by pushing a tag matching "v*" (e.g., v0.0.0-beta.0). The tag must
# equal "v" + VERSION_FULL_STRING from Version.h, or the run fails up front.
#
# Jobs:
#   parse-version   -> Extracts app name (Publication.h) and version strings
#                      (Version.h); checks them against the pushed tag
#   linux           -> AppImage (x86_64)
#   macos           -> .dmg (ARM / Apple Silicon)
#   windows         -> Inno Setup installer (.exe)
#   msix            -> MSIX package (.msix) for the Microsoft Store, from the
#                      windows job's deployment. Uploaded to the run, never to
#                      the release, and only for a stable version or, before
#                      1.0, a prerelease whose label ends in .0
#   microsoft-store -> Submits the MSIX to Partner Center, after approval
#   release         -> Attaches the AppImage, .dmg, and installer to the GitHub
#                      Release
#
# The release doesn't wait for msix or microsoft-store, so a failed package or
# submission never holds up the release. Re-running the failed msix job builds
# the package again from the same deployment, which stays on the run with the
# run's other artifacts
#
# Path assumptions (from repo root):
#   (.github/workflows/release.yml)
#   .github/WindowsInstaller.iss
#   .github/msix/                    (manifest template and assets)
#   .github/scripts/build_release_text.py
#   .github/scripts/BuildMsix.ps1
#   Fernanda/                        (CMake source dir)
#   Fernanda/src/core/Version.h
#   Fernanda/src/core/Publication.h
#   CHANGELOG.md
#   README.md
#   LICENSE
#   PRIVACY.md
#
# Secrets (Windows Qt install): QT_EMAIL, QT_PW
# Secrets (microsoft-store environment): PARTNER_CENTER_TENANT_ID,
#   PARTNER_CENTER_SELLER_ID, PARTNER_CENTER_CLIENT_ID,
#   PARTNER_CENTER_CLIENT_SECRET
#
# The tests are not built here (APP_BUILD_TESTS=OFF). ci.yml builds and runs
# them on every push

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '6.11.2'
  BUILD_TYPE: Release

jobs:

  # ===========================================================================
  # Parse Version.h / Publication.h
  # ===========================================================================
  #
  # Single source of truth for app name and version strings. All downstream
  # jobs reference these outputs instead of hardcoding values

  parse-version:
    runs-on: ubuntu-latest
    outputs:
      app_name:        ${{ steps.v.outputs.app_name }}
      version_full:    ${{ steps.v.outputs.version_full }}
      version_numeric: ${{ steps.v.outputs.version_numeric }}
      is_prerelease:   ${{ steps.v.outputs.is_prerelease }}
      msix:            ${{ steps.v.outputs.msix }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version and app name
        id: v
        run: |
          VER_FILE=Fernanda/src/core/Version.h
          PUB_FILE=Fernanda/src/core/Publication.h

          # NB: Each grep fails the step (bash -e) if its define is missing
          major=$(grep -oP '#define VERSION_MAJOR\s+\K[0-9]+' "$VER_FILE")
          minor=$(grep -oP '#define VERSION_MINOR\s+\K[0-9]+' "$VER_FILE")
          patch=$(grep -oP '#define VERSION_PATCH\s+\K[0-9]+' "$VER_FILE")
          is_pre=$(grep -oP '#define VERSION_IS_PRERELEASE\s+\K[01]' "$VER_FILE")
          app=$(grep -oP '#define PUB_APP_NAME_STRING\s+"\K[^"]+' "$PUB_FILE")

          numeric="${major}.${minor}.${patch}"
          if [ "$is_pre" = "1" ]; then
            pre=$(grep -oP '#define VERSION_PRERELEASE_STRING\s+"\K[^"]+' "$VER_FILE")
            full="${numeric}-${pre}"
          else
            full="${numeric}"
          fi

          # Artifacts, the release title, and the notes all come from
          # Version.h, but GitHub attaches them to the pushed tag
          if [ "$GITHUB_REF_NAME" != "v${full}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Version.h (v${full})"
            exit 1
          fi

          echo "app_name=${app}" >> "$GITHUB_OUTPUT"
          echo "version_full=${full}" >> "$GITHUB_OUTPUT"
          echo "version_numeric=${numeric}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([ "$is_pre" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # The Store takes each package version once, and only higher ones.
          # Its version is Major.Minor.Patch.0 (BuildMsix.ps1), with no room
          # for a prerelease label, so a prerelease and the release with its
          # numbers would be one version. Before 1.0, every release has new
          # numbers, so its first prerelease gets a package and later ones
          # don't. From 1.0 on, a prerelease leads up to a release with its
          # numbers, so only the release does. Patches and every stable
          # release get one
          if [ "$is_pre" = "0" ] || { [ "$major" = "0" ] && [[ "$pre" =~ \.0$ ]]; }; then
            msix=true
          else
            msix=false
          fi
          echo "msix=${msix}" >> "$GITHUB_OUTPUT"

          echo "Parsed: ${app} ${full} (numeric: ${numeric}, MSIX: ${msix})"

  # ===========================================================================
  # Linux AppImage
  # ===========================================================================
  #
  # NB: 22.04 (not latest) for an older glibc baseline, so the AppImage runs on
  # more distros; gcc-13 comes from the toolchain PPA for C++20

  linux:
    needs: parse-version
    runs-on: ubuntu-22.04
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats qtpdf

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 \
            libxcb1-dev libx11-xcb-dev libxkbcommon-dev \
            libgl1-mesa-dev libfuse2

      - name: Configure
        run: |
          cmake -B build -S Fernanda \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # Installs the binary, the .desktop entry, and the hicolor icons
      # (CMakeLists.txt, Install); linuxdeploy requires the latter two
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        env:
          EXTRA_QT_PLUGINS: iconengines;imageformats;platforms
        run: |
          # Strip unneeded plugins:
          rm -rf "$QT_ROOT_DIR/plugins/networkinformation"
          rm -rf "$QT_ROOT_DIR/plugins/generic"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          mv ${{ env.APP }}-*.AppImage \
             ${{ env.APP }}_${{ env.VER }}_Linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: ${{ env.APP }}_*.AppImage

  # ===========================================================================
  # macOS .dmg (ARM / Apple Silicon)
  # ===========================================================================

  macos:
    needs: parse-version
    runs-on: macos-15
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats qtpdf

      - name: Configure
        run: |
          cmake -B build -S Fernanda \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy
        run: |
          cd build
          macdeployqt ${{ env.APP }}.app
          # Strip unneeded plugins:
          rm -rf "${{ env.APP }}.app/Contents/PlugIns/generic"
          rm -rf "${{ env.APP }}.app/Contents/PlugIns/networkinformation"
          hdiutil create -volname "${{ env.APP }}" -srcfolder "${{ env.APP }}.app" \
            -ov -format UDZO "../${{ env.APP }}_${{ env.VER }}_macOS-ARM64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: ${{ env.APP }}_*.dmg

  # ===========================================================================
  # Windows Installer (Inno Setup)
  # ===========================================================================

  windows:
    needs: parse-version
    runs-on: windows-latest
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
      VER_NUMERIC: ${{ needs.parse-version.outputs.version_numeric }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats
          # See: https://github.com/miurahr/aqtinstall/issues/1007
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}

      # See: https://github.com/miurahr/aqtinstall/issues/1007
      - name: Install Qt extensions (PDF)
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_WORKSPACE "Qt\MaintenanceTool.exe"
          if (-not (Test-Path $tool)) { throw "MaintenanceTool not found at $tool" }

          $tag = "${{ env.QT_VERSION }}".Replace('.', '')
          $proc = Start-Process -FilePath $tool -ArgumentList `
            "--accept-licenses", `
            "--accept-obligations", `
            "--confirm-command", `
            "--email", "${{ secrets.QT_EMAIL }}", `
            "--pw", "${{ secrets.QT_PW }}", `
            "--auto-answer", "telemetry-question=No", `
            "install", `
            "extensions.qtpdf.${tag}.win64_msvc2022_64" `
            -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) { throw "MaintenanceTool exited with $($proc.ExitCode)" }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build -S Fernanda -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # ---------------------------------------------------------------
      # Stage into .github/temp/ (ISS resolves paths relative to its
      # own directory, so temp/ must be a sibling). Translations are
      # embedded in the exe (CMakeLists.txt, Translations), so only
      # the exe and its Qt deployment are staged
      # ---------------------------------------------------------------

      - name: Stage deployment
        shell: pwsh
        run: |
          $temp = ".github/temp"
          New-Item -ItemType Directory -Force -Path $temp

          # Exe
          Copy-Item "build/${{ env.APP }}.exe" $temp/

          # windeployqt (strip unneeded plugins)
          & windeployqt6 `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            --skip-plugin-types generic,networkinformation `
            "$temp/${{ env.APP }}.exe"

      # For the msix job, before the installer's VC++ Redistributable joins
      # the staging folder. NB: The path starts with a dot, so hidden files
      # are included explicitly; the deployment itself has none
      - name: Upload deployment for the MSIX
        if: needs.parse-version.outputs.msix == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-deploy
          path: .github/temp/
          include-hidden-files: true

      # Extracted to {tmp} and run by the installer, never installed
      # (WindowsInstaller.iss, [Files])
      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile ".github/temp/vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          & $iscc `
            /DAppVersion="${{ env.VER }}" `
            /DAppVersionNumeric="${{ env.VER_NUMERIC }}" `
            /DInstallerName="${{ env.APP }}Installer" `
            /DReadmePath="..\README.md" `
            /DLicensePath="..\LICENSE" `
            /DPrivacyPath="..\PRIVACY.md" `
            /DOutputDir="..\output" `
            ".github/WindowsInstaller.iss"

          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      - name: Rename installer
        shell: pwsh
        run: |
          Rename-Item "output/${{ env.APP }}Installer.exe" `
            "${{ env.APP }}_${{ env.VER }}_Windows-x64-Installer.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: output/${{ env.APP }}_*.exe

  # ===========================================================================
  # MSIX package (Microsoft Store)
  # ===========================================================================
  #
  # Unsigned: Partner Center signs it on submission. Built from the windows
  # job's deployment rather than a fresh build, so re-running this job alone
  # packages the exact exe that was released. A Developer Command Prompt puts
  # makeappx and makepri on PATH and sets VCToolsRedistDir (BuildMsix.ps1)

  msix:
    needs: [parse-version, windows]
    if: needs.parse-version.outputs.msix == 'true'
    runs-on: windows-latest
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER_NUMERIC: ${{ needs.parse-version.outputs.version_numeric }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: windows-deploy
          path: deploy

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build MSIX
        shell: pwsh
        run: |
          & .github/scripts/BuildMsix.ps1 `
            -Deployment deploy `
            -Version "${{ env.VER_NUMERIC }}" `
            -Output msix

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-msix
          path: msix/${{ env.APP }}_*.msix

  # ===========================================================================
  # Microsoft Store submission
  # ===========================================================================
  #
  # Sends the msix job's package to Partner Center as a new submission, which
  # goes through certification and then out to the Store. Only the package
  # changes; the listing stays as it is in Partner Center. The microsoft-store
  # environment holds the Partner Center credentials and waits for approval, so
  # nothing is submitted until the release has been checked. A new submission
  # replaces any draft in Partner Center, and can't be made while an earlier
  # one is still in certification. Skipped whenever msix is

  microsoft-store:
    needs: [parse-version, msix]
    runs-on: windows-latest
    environment: microsoft-store
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER_NUMERIC: ${{ needs.parse-version.outputs.version_numeric }}
      STORE_ID: 9NJMQV8QR056
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-msix
          path: msix

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Sign in to Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID `
            --clientSecret $env:CLIENT_SECRET

          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure exited with $LASTEXITCODE" }

      - name: Submit to the Store
        shell: pwsh
        run: |
          msstore publish "msix/${{ env.APP }}_${{ env.VER_NUMERIC }}_Windows-x64.msix" `
            -id ${{ env.STORE_ID }}

          if ($LASTEXITCODE -ne 0) { throw "msstore publish exited with $LASTEXITCODE" }

  # ===========================================================================
  # Attach to GitHub Release
  # ===========================================================================

  release:
    needs: [parse-version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
    steps:
      - uses: actions/checkout@v5

      # Each by name, so the msix job's artifacts (the deployment and the
      # package) stay out of the release
      - uses: actions/download-artifact@v7
        with:
          name: linux-appimage

      - uses: actions/download-artifact@v7
        with:
          name: macos-dmg

      - uses: actions/download-artifact@v7
        with:
          name: windows-installer

      - name: Assemble release body
        id: body
        run: |
          python3 .github/scripts/build_release_text.py \
            --changelog CHANGELOG.md \
            --version "${{ env.VER }}" \
            --output RELEASE_BODY.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.body.outputs.release_title }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ needs.parse-version.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.APP }}_*.AppImage
            ${{ env.APP }}_*.dmg
            ${{ env.APP }}_*.exe

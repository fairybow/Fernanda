# =============================================================================
# Fernanda: Release
# =============================================================================
#
# Triggered by pushing a tag matching "v*" (e.g., v0.0.0-beta.0). The tag must
# equal "v" + VERSION_FULL_STRING from Version.h, or the run fails up front.
#
# Jobs:
#   parse-version  -> Extracts app name (Publication.h) and version strings
#                     (Version.h); checks them against the pushed tag
#   linux          -> AppImage (x86_64)
#   macos          -> .dmg (ARM / Apple Silicon)
#   windows        -> Inno Setup installer (.exe)
#   release        -> Attaches all artifacts to the GitHub Release
#
# Path assumptions (from repo root):
#   (.github/workflows/release.yml)
#   .github/WindowsInstaller.iss
#   .github/scripts/build_release_text.py
#   Fernanda/                        (CMake source dir)
#   Fernanda/src/core/Version.h
#   Fernanda/src/core/Publication.h
#   CHANGELOG.md
#   README.md
#   LICENSE
#   PRIVACY.md
#
# Secrets (Windows Qt install): QT_EMAIL, QT_PW
#
# The tests are not built here (APP_BUILD_TESTS=OFF). ci.yml builds and runs
# them on every push

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '6.11.2'
  BUILD_TYPE: Release

jobs:

  # ===========================================================================
  # Parse Version.h / Publication.h
  # ===========================================================================
  #
  # Single source of truth for app name and version strings. All downstream
  # jobs reference these outputs instead of hardcoding values

  parse-version:
    runs-on: ubuntu-latest
    outputs:
      app_name:        ${{ steps.v.outputs.app_name }}
      version_full:    ${{ steps.v.outputs.version_full }}
      version_numeric: ${{ steps.v.outputs.version_numeric }}
      is_prerelease:   ${{ steps.v.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version and app name
        id: v
        run: |
          VER_FILE=Fernanda/src/core/Version.h
          PUB_FILE=Fernanda/src/core/Publication.h

          # NB: Each grep fails the step (bash -e) if its define is missing
          major=$(grep -oP '#define VERSION_MAJOR\s+\K[0-9]+' "$VER_FILE")
          minor=$(grep -oP '#define VERSION_MINOR\s+\K[0-9]+' "$VER_FILE")
          patch=$(grep -oP '#define VERSION_PATCH\s+\K[0-9]+' "$VER_FILE")
          is_pre=$(grep -oP '#define VERSION_IS_PRERELEASE\s+\K[01]' "$VER_FILE")
          app=$(grep -oP '#define PUB_APP_NAME_STRING\s+"\K[^"]+' "$PUB_FILE")

          numeric="${major}.${minor}.${patch}"
          if [ "$is_pre" = "1" ]; then
            pre=$(grep -oP '#define VERSION_PRERELEASE_STRING\s+"\K[^"]+' "$VER_FILE")
            full="${numeric}-${pre}"
          else
            full="${numeric}"
          fi

          # Artifacts, the release title, and the notes all come from
          # Version.h, but GitHub attaches them to the pushed tag
          if [ "$GITHUB_REF_NAME" != "v${full}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Version.h (v${full})"
            exit 1
          fi

          echo "app_name=${app}" >> "$GITHUB_OUTPUT"
          echo "version_full=${full}" >> "$GITHUB_OUTPUT"
          echo "version_numeric=${numeric}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([ "$is_pre" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Parsed: ${app} ${full} (numeric: ${numeric})"

  # ===========================================================================
  # Linux AppImage
  # ===========================================================================
  #
  # NB: 22.04 (not latest) for an older glibc baseline, so the AppImage runs on
  # more distros; gcc-13 comes from the toolchain PPA for C++20

  linux:
    needs: parse-version
    runs-on: ubuntu-22.04
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats qtpdf

      - name: Install system dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 \
            libxcb1-dev libx11-xcb-dev libxkbcommon-dev \
            libgl1-mesa-dev libfuse2

      - name: Configure
        run: |
          cmake -B build -S Fernanda \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # Installs the binary, the .desktop entry, and the hicolor icons
      # (CMakeLists.txt, Install); linuxdeploy requires the latter two
      - name: Install to AppDir
        run: DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        env:
          EXTRA_QT_PLUGINS: iconengines;imageformats;platforms
        run: |
          # Strip unneeded plugins:
          rm -rf "$QT_ROOT_DIR/plugins/networkinformation"
          rm -rf "$QT_ROOT_DIR/plugins/generic"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage
          mv ${{ env.APP }}-*.AppImage \
             ${{ env.APP }}_${{ env.VER }}_Linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: ${{ env.APP }}_*.AppImage

  # ===========================================================================
  # macOS .dmg (ARM / Apple Silicon)
  # ===========================================================================

  macos:
    needs: parse-version
    runs-on: macos-14
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats qtpdf

      - name: Configure
        run: |
          cmake -B build -S Fernanda \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy
        run: |
          cd build
          macdeployqt ${{ env.APP }}.app
          # Strip unneeded plugins:
          rm -rf "${{ env.APP }}.app/Contents/PlugIns/generic"
          rm -rf "${{ env.APP }}.app/Contents/PlugIns/networkinformation"
          hdiutil create -volname "${{ env.APP }}" -srcfolder "${{ env.APP }}.app" \
            -ov -format UDZO "../${{ env.APP }}_${{ env.VER }}_macOS-ARM64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: ${{ env.APP }}_*.dmg

  # ===========================================================================
  # Windows Installer (Inno Setup)
  # ===========================================================================

  windows:
    needs: parse-version
    runs-on: windows-latest
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
      VER_NUMERIC: ${{ needs.parse-version.outputs.version_numeric }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats
          # See: https://github.com/miurahr/aqtinstall/issues/1007
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}

      # See: https://github.com/miurahr/aqtinstall/issues/1007
      - name: Install Qt extensions (PDF)
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_WORKSPACE "Qt\MaintenanceTool.exe"
          if (-not (Test-Path $tool)) { throw "MaintenanceTool not found at $tool" }

          $tag = "${{ env.QT_VERSION }}".Replace('.', '')
          $proc = Start-Process -FilePath $tool -ArgumentList `
            "--accept-licenses", `
            "--accept-obligations", `
            "--confirm-command", `
            "--email", "${{ secrets.QT_EMAIL }}", `
            "--pw", "${{ secrets.QT_PW }}", `
            "--auto-answer", "telemetry-question=No", `
            "install", `
            "extensions.qtpdf.${tag}.win64_msvc2022_64" `
            -Wait -NoNewWindow -PassThru

          if ($proc.ExitCode -ne 0) { throw "MaintenanceTool exited with $($proc.ExitCode)" }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build -S Fernanda -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DAPP_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel

      # ---------------------------------------------------------------
      # Stage into .github/temp/ (ISS resolves paths relative to its
      # own directory, so temp/ must be a sibling). Translations are
      # embedded in the exe (CMakeLists.txt, Translations), so only
      # the exe and its Qt deployment are staged
      # ---------------------------------------------------------------

      - name: Stage deployment
        shell: pwsh
        run: |
          $temp = ".github/temp"
          New-Item -ItemType Directory -Force -Path $temp

          # Exe
          Copy-Item "build/${{ env.APP }}.exe" $temp/

          # windeployqt (strip unneeded plugins)
          & windeployqt6 `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            --skip-plugin-types generic,networkinformation `
            "$temp/${{ env.APP }}.exe"

      # Extracted to {tmp} and run by the installer, never installed
      # (WindowsInstaller.iss, [Files])
      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile ".github/temp/vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          & $iscc `
            /DAppVersion="${{ env.VER }}" `
            /DAppVersionNumeric="${{ env.VER_NUMERIC }}" `
            /DInstallerName="${{ env.APP }}Installer" `
            /DReadmePath="..\README.md" `
            /DLicensePath="..\LICENSE" `
            /DPrivacyPath="..\PRIVACY.md" `
            /DOutputDir="..\output" `
            ".github/WindowsInstaller.iss"

          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      - name: Rename installer
        shell: pwsh
        run: |
          Rename-Item "output/${{ env.APP }}Installer.exe" `
            "${{ env.APP }}_${{ env.VER }}_Windows-x64-Installer.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: output/${{ env.APP }}_*.exe

  # ===========================================================================
  # Attach to GitHub Release
  # ===========================================================================

  release:
    needs: [parse-version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP: ${{ needs.parse-version.outputs.app_name }}
      VER: ${{ needs.parse-version.outputs.version_full }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Assemble release body
        id: body
        run: |
          python3 .github/scripts/build_release_text.py \
            --changelog CHANGELOG.md \
            --version "${{ env.VER }}" \
            --output RELEASE_BODY.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.body.outputs.release_title }}
          body_path: RELEASE_BODY.md
          prerelease: ${{ needs.parse-version.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.APP }}_*.AppImage
            ${{ env.APP }}_*.dmg
            ${{ env.APP }}_*.exe
